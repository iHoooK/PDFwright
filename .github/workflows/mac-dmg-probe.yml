name: DMG launch probe (temporary)

# ВРЕМЕННО (docs/MACOS_PLAN.md, M3.1): запуск программы прямо из смонтированного .dmg.
# macOS 15 и 26 на Apple Silicon и Intel, итоги — в ci/mac-results, mac/dmg-probe-open/<машина>.
on:
  push:
    branches: ['mac/final']
    paths:
      - .github/workflows/mac-dmg-probe.yml
      - scripts/probe-dmg.mjs
      - scripts/probe-print.mjs

permissions:
  contents: write

jobs:
  probe:
    name: ${{ matrix.runner }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-26
            arch: arm64
          - runner: macos-15-intel
            arch: x64
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: node scripts/ci-results.mjs run install npm ci

      - name: Build
        run: node scripts/ci-results.mjs run build npm run build

      - name: Print probe
        continue-on-error: true
        timeout-minutes: 8
        run: >-
          node scripts/ci-results.mjs run print
          node scripts/probe-print.mjs tests/fixtures/simple.pdf "$RUNNER_TEMP/ci-results"

      - name: DMG
        env:
          CSC_FOR_PULL_REQUEST: 'true'
        run: >-
          node scripts/ci-results.mjs run dmg
          npx electron-builder --mac dmg --${{ matrix.arch }} --publish never
          -c.directories.output=build/probe -c.dmg.artifactName=probe.dmg

      - name: Probe
        continue-on-error: true
        timeout-minutes: 70
        run: >-
          node scripts/ci-results.mjs run probe
          node scripts/probe-dmg.mjs build/probe/probe.dmg tests/fixtures/simple.pdf
          "$RUNNER_TEMP/ci-results"

      - name: Publish results to ci/mac-results
        if: always()
        run: node scripts/ci-results.mjs publish "mac/dmg-probe-open/${{ matrix.runner }}"
