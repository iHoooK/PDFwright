name: DMG launch probe (temporary)

# ВРЕМЕННО (выпуск 1.0.1): запуск из окна .dmg через Finder и настоящий ⌘P в собранной
# программе. Итоги — в ci/mac-results, mac/v101-probe/<машина>. Перед выпуском удаляется.
on:
  push:
    branches: ['mac/v1.0.1']
    paths:
      - .github/workflows/mac-dmg-probe.yml
      - scripts/probe-dmg.mjs

permissions:
  contents: write

jobs:
  probe:
    name: ${{ matrix.runner }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-26
            arch: arm64
          - runner: macos-15-intel
            arch: x64
          - runner: macos-26-intel
            arch: x64
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: node scripts/ci-results.mjs run install npm ci

      - name: Build
        run: node scripts/ci-results.mjs run build npm run build

      - name: DMG
        env:
          CSC_FOR_PULL_REQUEST: 'true'
        run: >-
          node scripts/ci-results.mjs run dmg
          npx electron-builder --mac dmg --${{ matrix.arch }} --publish never
          -c.directories.output=build/probe -c.dmg.artifactName=probe.dmg

      - name: Probe
        continue-on-error: true
        timeout-minutes: 40
        run: >-
          node scripts/ci-results.mjs run probe
          node scripts/probe-dmg.mjs build/probe/probe.dmg tests/fixtures/simple.pdf
          "$RUNNER_TEMP/ci-results"

      - name: Publish results to ci/mac-results
        if: always()
        run: node scripts/ci-results.mjs publish "mac/v101-probe/${{ matrix.runner }}"
