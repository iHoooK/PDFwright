name: Release PDFwright

# Запускается на тег вида v1.0.1: собирает Windows-файлы той же командой, что и автор,
# Mac-файлы на двух Mac-машинах (mac-release-build.yml) и публикует их одним релизом
# на GitHub с файлами для обновляторов (docs/MACOS_PLAN.md, правило 5). Публикация ждёт
# обе сборки: релиз без Windows- или Mac-файлов не выходит. Тег ставит автор, когда
# версия проверена, поэтому отдельного черновика нет.
on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Check that the tag matches package.json
        shell: pwsh
        run: |
          $version = (Get-Content package.json -Raw | ConvertFrom-Json).version
          if ("v$version" -ne $env:GITHUB_REF_NAME) {
            throw "Tag $env:GITHUB_REF_NAME does not match package.json version $version"
          }
          "Releasing PDFwright $version"

      - name: Install dependencies
        run: npm ci

      - name: Release build
        shell: bash
        run: bash scripts/build-release.sh

      - name: Verify updater metadata
        shell: pwsh
        run: |
          foreach ($name in 'PDFwright-Setup-x64.exe', 'PDFwright-Setup-x64.exe.blockmap', 'latest.yml', 'PDFwright-Portable-x64.zip', 'SHA256SUMS.txt') {
            $path = Join-Path $env:GITHUB_WORKSPACE "build/$name"
            if (-not (Test-Path $path)) { throw "Release file not found: $path" }
          }
          Get-Content (Join-Path $env:GITHUB_WORKSPACE 'build/latest.yml')

      - name: Upload Windows files
        uses: actions/upload-artifact@v7
        with:
          name: PDFwright-windows
          path: |
            build/PDFwright-Setup-x64.exe
            build/PDFwright-Setup-x64.exe.blockmap
            build/latest.yml
            build/PDFwright-Portable-x64.zip
            build/SHA256SUMS.txt
          if-no-files-found: error

  mac:
    uses: ./.github/workflows/mac-release-build.yml

  publish:
    needs: [windows, mac]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - uses: actions/download-artifact@v8
        with:
          name: PDFwright-windows
          path: build

      - uses: actions/download-artifact@v8
        with:
          name: PDFwright-mac
          path: build

      - name: Verify release files
        run: |
          for name in PDFwright-Setup-x64.exe PDFwright-Setup-x64.exe.blockmap latest.yml \
            PDFwright-Portable-x64.zip SHA256SUMS.txt \
            PDFwright-Mac-AppleSilicon.dmg PDFwright-Mac-Intel.dmg \
            PDFwright-Portable-Mac-AppleSilicon.zip PDFwright-Portable-Mac-Intel.zip \
            latest-mac.yml SHA256SUMS-Mac.txt; do
            if [[ ! -f "build/$name" ]]; then echo "::error::Release file not found: build/$name"; exit 1; fi
          done
          version="$(node -p "require('./package.json').version")"
          grep -qx "version: $version" build/latest.yml
          grep -qx "version: $version" build/latest-mac.yml
          # SHA256SUMS.txt пишет PowerShell с окончаниями CRLF.
          (cd build && tr -d '\r' < SHA256SUMS.txt | sha256sum -c - && sha256sum -c SHA256SUMS-Mac.txt)

      # Описание релиза — RELEASE_NOTES.md; раздел «Для Mac» добавляется, если его там нет.
      - name: Release notes
        run: |
          if grep -q '^## Для Mac' RELEASE_NOTES.md; then
            cp RELEASE_NOTES.md build/release-notes.md
          else
            { cat RELEASE_NOTES.md; echo; cat installer/release-section-mac.md; } > build/release-notes.md
          fi

      - name: Publish release
        if: github.ref_type == 'tag'
        uses: softprops/action-gh-release@v3
        with:
          draft: false
          prerelease: false
          make_latest: true
          name: PDFwright ${{ github.ref_name }}
          body_path: build/release-notes.md
          files: |
            build/PDFwright-Setup-x64.exe
            build/PDFwright-Setup-x64.exe.blockmap
            build/latest.yml
            build/PDFwright-Portable-x64.zip
            build/SHA256SUMS.txt
            build/PDFwright-Mac-AppleSilicon.dmg
            build/PDFwright-Mac-Intel.dmg
            build/PDFwright-Portable-Mac-AppleSilicon.zip
            build/PDFwright-Portable-Mac-Intel.zip
            build/latest-mac.yml
            build/SHA256SUMS-Mac.txt
