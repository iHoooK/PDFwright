name: Build PDFwright

on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      # Та же команда, что у автора: проверки, сборка, установщик, portable, суммы.
      - name: Release build
        shell: bash
        run: bash scripts/build-release.sh

      # Сквозные тесты на собранном Electron: открытие, правка, сохранение, большой документ.
      - name: E2E tests
        run: npm run test:e2e

      - name: Verify release files
        shell: pwsh
        run: |
          foreach ($name in 'PDFwright-Setup-x64.exe', 'PDFwright-Portable-x64.zip', 'SHA256SUMS.txt') {
            $path = Join-Path $env:GITHUB_WORKSPACE "build/$name"
            if (-not (Test-Path $path)) { throw "Release file not found: $path" }
            Get-Item $path | Select-Object Name, Length
          }
          Get-Content (Join-Path $env:GITHUB_WORKSPACE 'build/SHA256SUMS.txt')

      - name: Upload release files
        uses: actions/upload-artifact@v4
        with:
          name: PDFwright-win-x64
          path: |
            build/PDFwright-Setup-x64.exe
            build/PDFwright-Portable-x64.zip
            build/SHA256SUMS.txt
          if-no-files-found: error
