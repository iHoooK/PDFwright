# Конфигурация упаковки electron-builder (фаза 7).
# Установщик NSIS с выбором папки и дополнительными задачами (installer/installer.nsh),
# portable-архив собирается скриптом scripts/package-release.ps1 из win-unpacked.
appId: ru.promptix.pdfwright
productName: PDFwright
copyright: Copyright © 2026 Promptix
executableName: PDFwright
artifactName: ${productName}-${version}-${os}-${arch}.${ext}

directories:
  buildResources: installer
  output: build

# В упаковку идут только собранные out/ и package.json (все зависимости — в бандле).
# Исключены карты кода и ресурсы pdf.js, которые программа не загружает: запасные
# JS-декодеры на случай, когда WebAssembly недоступен (в Electron он есть), и
# QuickJS для скриптов PDF (скрипты выключены).
files:
  - out/**
  - package.json
  - '!**/*.map'
  - '!out/renderer/pdfjs/wasm/*_nowasm_fallback.js'
  - '!out/renderer/pdfjs/wasm/quickjs-eval.*'

# Интерфейс только на русском и английском: остальные языки Chromium (~49 МБ) не нужны.
electronLanguages:
  - ru
  - en-US

# Наибольшее сжатие установщика (LZMA, solid): сборка дольше, файл меньше.
compression: maximum

# Документы рядом с программой, как у ЛовиКадра.
extraFiles:
  - from: LICENSE
    to: LICENSE.txt
  - from: PRIVACY.md
    to: PRIVACY.md
  - from: THIRD_PARTY_NOTICES.md
    to: THIRD_PARTY_NOTICES.md

asar: true

win:
  icon: installer/icon.ico
  target:
    - target: nsis
      arch: [x64]
  requestedExecutionLevel: asInvoker
  legalTrademarks: Promptix

nsis:
  oneClick: false
  perMachine: true
  allowToChangeInstallationDirectory: true
  allowElevation: true
  createDesktopShortcut: false
  createStartMenuShortcut: true
  runAfterFinish: true
  deleteAppDataOnUninstall: false
  multiLanguageInstaller: true
  installerLanguages:
    - ru_RU
    - en_US
  installerIcon: installer/icon.ico
  uninstallerIcon: installer/icon.ico
  installerHeaderIcon: installer/icon.ico
  include: installer/installer.nsh
  artifactName: ${productName}-Setup-x64.${ext}
  shortcutName: PDFwright
  uninstallDisplayName: PDFwright
  # Имя для «Установленных приложений» и пути обновления (фаза 8).
  guid: 6D5C0B6E-3B2A-4F3E-9C1E-5A4B7C8D9E01

# macOS 13+: .dmg и переносной .zip отдельно для Apple Silicon и Intel, без подписи Apple
# (docs/MACOS_PLAN.md, фаза M2). Выпускные имена с AppleSilicon/Intel подставляет
# scripts/build-release-mac.sh: в шаблоне имени процессор есть только как arm64/x64,
# поэтому каждый процессор собирается отдельным запуском, а latest-mac.yml сливается.
mac:
  icon: installer/icon-mac.png
  category: public.app-category.productivity
  minimumSystemVersion: '13.0'
  darkModeSupport: true
  target:
    - target: dmg
      arch: [arm64, x64]
    - target: zip
      arch: [arm64, x64]
  artifactName: ${productName}-Portable-Mac-${arch}.${ext}
  # Ad-hoc подпись обязательна: без неё Apple Silicon пишет «Программа повреждена».
  # Hardened Runtime нужен только для нотаризации, а с ad-hoc подписью мешает
  # загрузке библиотек Electron.
  identity: '-'
  hardenedRuntime: false
  gatekeeperAssess: false
  # Перед подписью переносит общие extraFiles из Contents в Contents/Resources:
  # файлы в корне Contents codesign принимает за неподписанный код.
  sign: ./scripts/mac-sign.mjs
  # Только здесь, не на верхнем уровне: там он изменил бы установщик Windows.
  # Viewer и Alternate: PDFwright появляется в «Открыть в программе», а программой
  # по умолчанию для PDF остаётся «Просмотр», пока пользователь не выберет сам.
  fileAssociations:
    - ext: pdf
      name: PDF
      role: Viewer
      rank: Alternate

# Окно .dmg: программа слева, ссылка на «Программы» справа — перетащить одно на другое.
dmg:
  artifactName: ${productName}-Mac-${arch}.${ext}
  title: ${productName}
  # Без окна лицензии при открытии .dmg (на Mac так не принято). Иначе dmg-builder
  # сам берёт installer/license_*.txt установщика NSIS, а их BOM и кириллицу
  # dmgbuild не кодирует.
  license: null
  window:
    width: 540
    height: 380
  contents:
    - x: 140
      y: 180
    - x: 400
      y: 180
      type: link
      path: /Applications

# Для latest.yml и app-update.yml; загрузку в релиз делает workflow, не electron-builder.
publish:
  provider: github
  owner: iHoooK
  repo: PDFwright
  releaseType: release
