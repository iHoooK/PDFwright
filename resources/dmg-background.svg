    <text x="270" y="50" font-size="17" font-weight="600" fill="#1d1d1f">Перетащите PDFwright в папку «Программы»</text>
    <text x="270" y="73" font-size="12.5" fill="#6e6e73">Drag PDFwright to the Applications folder</text>
